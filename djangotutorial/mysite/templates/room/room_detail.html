<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ room.name }}</title>
</head>
<body>
    <h1>{{ room.name }}</h1>
    <img src="{{ room.image_url }}" alt="{{ room.name }}" style="max-width: 300px; border-radius: 8px;">
    <p>Kapazität: {{ room.capacity }}</p>
    <p>Ausstattung: {{ room.amenities }}</p>

    <form method="post" action="{% url 'book_room' room.id %}">
        {% csrf_token %}
        <label for="user">Ihr Name:</label>
        <input type="text" name="user" id="user" required>
        <label for="date">Datum:</label>
        <input type="date" name="date" id="date" required>
        <label for="time_start">Startzeit:</label>
        <input type="time" name="time_start" id="time_start" required>
        <label for="time_end">Endzeit:</label>
        <input type="time" name="time_end" id="time_end" required>
        <button type="submit">Buchen</button>
    </form>
</body>
</html>
